<script>

const LS="peddlers.v1";

const S={db:null,dl:null,mgr:false,setup:{items:[],peddlers:[],comm:0},days:{},day:today(),tab:"day",open:{},loaded:false};

/* ---------- money ---------- */
const itemsAll=()=>S.setup.items||[];

const pName=id=>((S.setup.peddlers||[]).find(p=>p.id===id)||{}).name||"(removed peddler)";

const taken=(r,iid)=>(r.loads||[]).reduce((a,l)=>a+num((l.q||{})[iid]),0);

/* running balance: everything turned in minus everything due, over settled days up to and including `upto` */
function balance(pid,upto){
  let b=0;Object.keys(S.days).forEach(d=>{if(upto&&d>upto)return;const r=((S.days[d]||{}).peddlers||{})[pid];if(!r)return;const c=calc(r);if(c.paid!=null)b+=c.diff});
  return b;
}

/* ---------- saving ---------- */
let saveT={},saving=0;
function dayDoc(d){return S.days[d]||(S.days[d]={date:d,peddlers:{}})}

async function saveDay(d){
  const doc=dayDoc(d);doc.date=d;
  try{if(S.db)await S.db.collection("pdl/days").doc(d).set(JSON.parse(JSON.stringify(doc)));else{const l=lsGet(LS,{});l.days=S.days;lsSet(LS,l)}$("#saved").textContent="Saved"}
  catch(e){$("#saved").textContent="Not saved: "+(e.message||e.code||"try again")}
}

  try{if(S.db)await S.db.doc("pdl/setup").set(JSON.parse(JSON.stringify(S.setup)));else{const l=lsGet(LS,{});l.setup=S.setup;lsSet(LS,l)}toast("Saved")}

/* ---------- Today ---------- */
function renderDay(){
  if(!S.mgr)S.day=today();
  $("#dayName").textContent=(S.day===today()?"Today, ":"")+fmtD(S.day);
  $("#dayPick").value=S.day;
  const doc=S.days[S.day]||{peddlers:{}},recs=doc.peddlers||{};
  const ids=Object.keys(recs);
  let tk=0,sold=0,sales=0,due=0,paid=0,short=0,out=0;
  ids.forEach(id=>{const c=calc(recs[id]);tk+=c.tk;sold+=c.sold;sales+=c.sales;due+=c.due;if(c.paid==null)out++;else{paid+=c.paid;if(c.diff<0)short+=-c.diff}});
  $("#tiles").innerHTML=`<div class="tile"><small>Peddlers out</small><b>${out} of ${ids.length}</b></div>
   <div class="tile"><small>Bread taken</small><b>${tk}</b></div><div class="tile"><small>Sold</small><b>${sold}</b></div>
   <div class="tile"><small>Sales</small><b>${peso(sales)}</b></div><div class="tile"><small>Cash turned in</small><b>${peso(paid)}</b></div>
   <div class="tile ${short?"bad":""}"><small>Short today</small><b>${peso(short)}</b></div>`;
  const ps=peddlers();
  $("#who").innerHTML=ps.length?ps.map(p=>`<button class="chip ${recs[p.id]?"on":""}" data-p="${p.id}">${esc(p.name)}</button>`).join(""):`<span class="muted">${S.mgr?"No peddlers yet. Add them in Peddlers &amp; bread.":"No peddlers yet. Ask the manager to add them."}</span>`;
  if(!S.loaded){$("#cards").innerHTML='<div class="empty">Opening…</div>';return}
  if(!items().length&&S.mgr){$("#cards").innerHTML='<div class="empty"><b>Add your breads first</b>Open Peddlers &amp; bread to list the breads and prices.</div>';return}
  if(!ids.length){$("#cards").innerHTML='<div class="empty"><b>No peddler sheets yet for this day</b>Tap a peddler\'s name above when they take bread out.</div>';return}
  const order=ids.sort((a,b)=>(recs[a].at||0)-(recs[b].at||0));
  $("#cards").innerHTML=order.map(id=>card(id,recs[id])).join("");
}
function card(pid,r){
  const c=calc(r),open=S.open[pid]!==false&&(S.open[pid]||c.paid==null);
  const bal=balance(pid,S.day);
  const st=c.paid==null?['Out selling','p-out']:c.diff<-0.004?['Short '+peso(-c.diff),'p-bad']:c.diff>0.004?['Over '+peso(c.diff),'p-ok']:['Settled','p-ok'];
  const balTxt=Math.abs(bal)<0.005?"":bal<0?`<span class="owe">Owes ${peso(-bal)} in total</span>`:`<span class="ahead">${peso(bal)} ahead in total</span>`;
  const head=`<div class="hd"><div><div class="nm">${esc(pName(pid))}</div><div class="muted">${(r.loads||[]).length} load${(r.loads||[]).length===1?"":"s"} · ${c.tk} taken · ${c.sold} sold ${balTxt?" · "+balTxt:""}</div></div>
    <div class="row"><span class="pill ${st[1]}">${st[0]}</span><button class="ghost" data-tog="${pid}">${open?"Hide":"Open"}</button></div></div>`;
  if(!open)return `<div class="card" data-card="${pid}">${head}</div>`;
  const L=r.loads||[],its=items().slice();
  itemsAll().forEach(i=>{if(i.gone&&(taken(r,i.id)||num((r.ret||{})[i.id])))its.push(i)});
  const rows=its.map(i=>{const t=taken(r,i.id),b=num((r.ret||{})[i.id]),s=Math.max(0,t-b),p=priceOf(r,i.id);
    return `<tr><td>${esc(i.name)}<div class="muted">${peso(p)}</div></td>${L.map((l,k)=>`<td class="n"><input class="n" inputmode="numeric" data-pid="${pid}" data-load="${k}" data-i="${i.id}" value="${(l.q||{})[i.id]??""}" aria-label="${esc(i.name)} load ${k+1}"></td>`).join("")}
      <td class="n"><input class="n" inputmode="numeric" data-pid="${pid}" data-ret="${i.id}" value="${(r.ret||{})[i.id]??""}" aria-label="${esc(i.name)} returned"></td>
      <td class="n" data-sold="${pid}|${i.id}">${t||b?s:""}</td><td class="n" data-amt="${pid}|${i.id}">${t||b?peso(s*p):""}</td></tr>`}).join("");
  return `<div class="card" data-card="${pid}">${head}
   <div class="tbl"><table><thead><tr><th>Bread</th>${L.map((l,k)=>`<th class="n">Load ${k+1}<div style="font-weight:500;text-transform:none">${esc(l.t||"")}</div></th>`).join("")}<th class="n">Returned</th><th class="n">Sold</th><th class="n">Sales</th></tr></thead>
   <tbody>${rows}</tbody></table></div>
   <div class="row"><button data-load-add="${pid}">+ Another load</button>${L.length>1?`<button class="ghost" data-load-del="${pid}">Remove last load</button>`:""}</div>
   <div class="sum" data-sum="${pid}">${sumHtml(r,c)}</div>
   <div class="cash"><label><span>Cash turned in ₱</span><input class="n" inputmode="decimal" data-pid="${pid}" data-cash value="${r.cash??""}" placeholder="when they come back"></label>
     <label><span>Commission %</span><input class="n" inputmode="decimal" data-pid="${pid}" data-comm value="${r.comm??""}" ${S.mgr?"":"disabled"}></label>
     <label class="wide"><span>Note</span><input data-pid="${pid}" data-note value="${esc(r.note||"")}" placeholder="e.g. 3 pandesal spoiled"></label></div>
   <div class="row muted">Recorded by ${esc(r.by||"—")}${S.mgr?` <button class="ghost danger" data-del="${pid}">Remove this sheet</button><span data-delask="${pid}"></span>`:""}</div></div>`;
}
function sumHtml(r,c){
  return `<div><small>Sales</small><b>${peso(c.sales)}</b></div><div><small>Commission</small><b>${peso(c.comm)}</b></div>
  <div><small>To turn in</small><b>${peso(c.due)}</b></div><div><small>${c.paid==null?"Turned in":c.diff<-0.004?"Short":c.diff>0.004?"Over":"Turned in"}</small><b class="${c.diff<-0.004?"owe":""}">${c.paid==null?"—":c.diff<-0.004||c.diff>0.004?peso(Math.abs(c.diff)):peso(c.paid)}</b></div>`;
}
function refreshCard(pid){
  const r=dayDoc(S.day).peddlers[pid],c=calc(r);
  itemsAll().forEach(i=>{const t=taken(r,i.id),b=num((r.ret||{})[i.id]),s=Math.max(0,t-b);
    const a=document.querySelector(`[data-sold="${pid}|${i.id}"]`),m=document.querySelector(`[data-amt="${pid}|${i.id}"]`);
    if(a)a.textContent=t||b?s:"";if(m)m.textContent=t||b?peso(s*priceOf(r,i.id)):""});
  const s=document.querySelector(`[data-sum="${pid}"]`);if(s)s.innerHTML=sumHtml(r,c);
}
function startSheet(pid){
  const doc=dayDoc(S.day);
  if(doc.peddlers[pid]){S.open[pid]=true;renderDay();return}
  const p=(S.setup.peddlers||[]).find(x=>x.id===pid)||{};
  const price={};items().forEach(i=>price[i.id]=num(i.price));
  doc.peddlers[pid]={loads:[{t:hhmm(),q:{}}],ret:{},price,comm:p.comm!=null&&p.comm!==""?num(p.comm):num(S.setup.comm),cash:"",note:"",by:me(),at:Date.now()};
  S.open[pid]=true;queueSave(S.day);renderDay();
  const f=document.querySelector(`[data-card="${pid}"] input[data-load="0"]`);if(f)f.focus();
}
const me=()=>(window.WS_USER&&window.WS_USER.name)||lsGet(LS+".by","")||"";

/* input handling: update state and the numbers around it, never rebuild the inputs while typing */
document.addEventListener("input",e=>{
  const el=e.target,pid=el.dataset.pid;if(!pid||S.tab!=="day")return;
  const r=dayDoc(S.day).peddlers[pid];if(!r)return;
  const v=el.value.trim();
  if(el.dataset.load!=null){const l=r.loads[+el.dataset.load];l.q=l.q||{};if(v==="")delete l.q[el.dataset.i];else l.q[el.dataset.i]=num(v)}
  else if(el.dataset.ret){r.ret=r.ret||{};if(v==="")delete r.ret[el.dataset.ret];else r.ret[el.dataset.ret]=num(v)}
  else if(el.hasAttribute("data-cash"))r.cash=v===""?"":num(v);
  else if(el.hasAttribute("data-comm"))r.comm=num(v);
  else if(el.hasAttribute("data-note"))r.note=el.value;
  r.by=r.by||me();r.u=Date.now();
  refreshCard(pid);queueSave(S.day);
});
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!typing()){S.pending=false;render()}},50));
const typing=()=>{const a=document.activeElement;return a&&a.tagName==="INPUT"&&a.closest("#cards,#vSet")};
$("#cards").addEventListener("change",e=>{if(e.target.hasAttribute("data-cash"))renderDay()});
$("#cards").addEventListener("click",e=>{
  const t=e.target;let id;
  if(id=t.dataset.tog){S.open[id]=!(t.textContent==="Hide");renderDay()}
  else if(id=t.dataset.loadAdd){const r=dayDoc(S.day).peddlers[id];r.loads.push({t:hhmm(),q:{}});queueSave(S.day);renderDay();const f=document.querySelector(`[data-card="${id}"] input[data-load="${r.loads.length-1}"]`);if(f)f.focus()}
  else if(id=t.dataset.loadDel){const r=dayDoc(S.day).peddlers[id];if(r.loads.length>1){r.loads.pop();queueSave(S.day);renderDay()}}
  else if(id=t.dataset.del){const a=document.querySelector(`[data-delask="${id}"]`);a.innerHTML=` <button class="danger" data-delyes="${id}">Yes, remove</button>`}
  else if(id=t.dataset.delyes){delete dayDoc(S.day).peddlers[id];queueSave(S.day);renderDay();toast("Sheet removed")}
});
$("#who").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b)startSheet(b.dataset.p)});
$("#dayPick").addEventListener("change",e=>{if(e.target.value){S.day=e.target.value;renderDay()}});

/* ---------- Report ---------- */
let R={from:"",to:""};
function renderRep(){
  const t=today();if(!R.from){R.from=t.slice(0,8)+"01";R.to=t}
  const days=Object.keys(S.days).filter(d=>d>=R.from&&d<=R.to).sort();
  const byP={},byI={},byD=[];
  days.forEach(d=>{const recs=S.days[d].peddlers||{};let ds={d,tk:0,sold:0,sales:0,due:0,paid:0};
    Object.keys(recs).forEach(pid=>{const c=calc(recs[pid]),p=byP[pid]=byP[pid]||{pid,days:0,tk:0,rt:0,sold:0,sales:0,comm:0,due:0,paid:0,diff:0,open:0};
      p.days++;p.tk+=c.tk;p.rt+=c.rt;p.sold+=c.sold;p.sales+=c.sales;p.comm+=c.comm;p.due+=c.due;if(c.paid==null)p.open++;else{p.paid+=c.paid;p.diff+=c.diff}
      c.lines.forEach(l=>{const i=byI[l.iid]=byI[l.iid]||{iid:l.iid,t:0,b:0,s:0,amt:0};i.t+=l.t;i.b+=l.b;i.s+=l.s;i.amt+=l.amt});
      ds.tk+=c.tk;ds.sold+=c.sold;ds.sales+=c.sales;ds.due+=c.due;ds.paid+=c.paid||0});
    if(Object.keys(recs).length)byD.push(ds)});
  const P=Object.values(byP).sort((a,b)=>b.sales-a.sales),I=Object.values(byI).sort((a,b)=>b.amt-a.amt);
  const tot=P.reduce((a,p)=>({sales:a.sales+p.sales,comm:a.comm+p.comm,due:a.due+p.due,paid:a.paid+p.paid,diff:a.diff+p.diff,sold:a.sold+p.sold}),{sales:0,comm:0,due:0,paid:0,diff:0,sold:0});
  const bals=(S.setup.peddlers||[]).map(p=>({p,b:balance(p.id)})).filter(x=>Math.abs(x.b)>=0.005);
  $("#vRep").innerHTML=`<div class="row"><label><span>From</span><input type="date" id="rFrom" value="${R.from}"></label><label><span>To</span><input type="date" id="rTo" value="${R.to}"></label>
    <button data-rng="month">This month</button><button data-rng="week">Last 7 days</button><button class="pri" id="rXl">Download Excel</button></div>
   <div class="tiles"><div class="tile"><small>Sold</small><b>${tot.sold}</b></div><div class="tile"><small>Sales</small><b>${peso(tot.sales)}</b></div><div class="tile"><small>Commission</small><b>${peso(tot.comm)}</b></div>
    <div class="tile"><small>To turn in</small><b>${peso(tot.due)}</b></div><div class="tile"><small>Turned in</small><b>${peso(tot.paid)}</b></div><div class="tile ${tot.diff<-0.004?"bad":""}"><small>Short / over</small><b>${peso(tot.diff)}</b></div></div>
   <div class="sec"><h2>By peddler</h2>${P.length?`<div class="tbl"><table><thead><tr><th>Peddler</th><th class="n">Days</th><th class="n">Taken</th><th class="n">Returned</th><th class="n">Sold</th><th class="n">Sales</th><th class="n">Commission</th><th class="n">To turn in</th><th class="n">Turned in</th><th class="n">Short / over</th></tr></thead><tbody>
     ${P.map(p=>`<tr><td>${esc(pName(p.pid))}${p.open?`<div class="muted">${p.open} day${p.open>1?"s":""} not settled</div>`:""}</td><td class="n">${p.days}</td><td class="n">${p.tk}</td><td class="n">${p.rt}</td><td class="n">${p.sold}</td><td class="n">${peso(p.sales)}</td><td class="n">${peso(p.comm)}</td><td class="n">${peso(p.due)}</td><td class="n">${peso(p.paid)}</td><td class="n ${p.diff<-0.004?"owe":""}">${peso(p.diff)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="muted">No peddler sales in these dates.</div>'}</div>
   <div class="sec"><h2>Running balance (all days)</h2>${bals.length?`<div class="tbl"><table><tbody>${bals.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="n ${x.b<0?"owe":"ahead"}">${x.b<0?"Owes "+peso(-x.b):peso(x.b)+" ahead"}</td></tr>`).join("")}</tbody></table></div>`:'<div class="muted">Every peddler is fully paid up.</div>'}</div>
   <div class="sec"><h2>By bread</h2>${I.length?`<div class="tbl"><table><thead><tr><th>Bread</th><th class="n">Taken</th><th class="n">Returned</th><th class="n">Sold</th><th class="n">Return %</th><th class="n">Sales</th></tr></thead><tbody>
     ${I.map(i=>`<tr><td>${esc(iName(i.iid))}</td><td class="n">${i.t}</td><td class="n">${i.b}</td><td class="n">${i.s}</td><td class="n">${i.t?Math.round(i.b/i.t*100)+"%":""}</td><td class="n">${peso(i.amt)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="muted">Nothing yet.</div>'}</div>
   <div class="sec"><h2>By day</h2>${byD.length?`<div class="tbl"><table><thead><tr><th>Day</th><th class="n">Taken</th><th class="n">Sold</th><th class="n">Sales</th><th class="n">To turn in</th><th class="n">Turned in</th></tr></thead><tbody>
     ${byD.reverse().map(d=>`<tr><td><button class="ghost" data-goday="${d.d}" style="padding:2px 0;white-space:nowrap">${esc(new Date(d.d+"T00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric"}))}</button></td><td class="n">${d.tk}</td><td class="n">${d.sold}</td><td class="n">${peso(d.sales)}</td><td class="n">${peso(d.due)}</td><td class="n">${peso(d.paid)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="muted">Nothing yet.</div>'}</div>`;
  $("#rFrom").onchange=e=>{R.from=e.target.value;renderRep()};$("#rTo").onchange=e=>{R.to=e.target.value;renderRep()};
  $("#vRep").querySelectorAll("[data-rng]").forEach(b=>b.onclick=()=>{const t=today();if(b.dataset.rng==="month"){R.from=t.slice(0,8)+"01";R.to=t}else{const d=new Date();d.setDate(d.getDate()-6);R.from=ymd(d);R.to=t}renderRep()});
  $("#vRep").querySelectorAll("[data-goday]").forEach(b=>b.onclick=()=>{S.day=b.dataset.goday;setTab("day")});
  $("#rXl").onclick=()=>excel(days,P,I);
}
async function excel(days,P,I){
  if(!window.XLSX)return toast("Excel isn't available right now.");
  const det=[],cash=[];
  days.forEach(d=>{const recs=S.days[d].peddlers||{};Object.keys(recs).forEach(pid=>{const r=recs[pid],c=calc(r);
    c.lines.forEach(l=>{const row={Date:d,Peddler:pName(pid),Bread:iName(l.iid),Price:l.p};(r.loads||[]).forEach((ld,k)=>row["Load "+(k+1)]=num((ld.q||{})[l.iid]));Object.assign(row,{Taken:l.t,Returned:l.b,Sold:l.s,Sales:l.amt});det.push(row)});
    cash.push({Date:d,Peddler:pName(pid),Loads:(r.loads||[]).length,Taken:c.tk,Returned:c.rt,Sold:c.sold,Sales:c.sales,"Commission %":num(r.comm),Commission:c.comm,"To turn in":c.due,"Turned in":c.paid==null?"":c.paid,"Short / over":c.diff==null?"not settled":c.diff,"Recorded by":r.by||"",Note:r.note||""})})});
  const wb=XLSX.utils.book_new(),add=(n,rows,w)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"":"No data"}]);if(w)ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)};
  add("By peddler",P.map(p=>({Peddler:pName(p.pid),Days:p.days,Taken:p.tk,Returned:p.rt,Sold:p.sold,Sales:p.sales,Commission:p.comm,"To turn in":p.due,"Turned in":p.paid,"Short / over":p.diff,"Days not settled":p.open,"Running balance (all days)":balance(p.pid)})),[18,6,8,9,7,11,11,11,11,11,9,14]);
  add("By bread",I.map(i=>({Bread:iName(i.iid),Taken:i.t,Returned:i.b,Sold:i.s,Sales:i.amt})),[20,8,9,7,11]);
  add("Cash per day",cash,[11,18,6,7,9,6,10,8,10,10,10,11,14,24]);
  add("Bread per day",det,[11,18,20,7]);
  const data=XLSX.write(wb,{bookType:"xlsx",type:"array"}),filename=`Peddler_sales_${R.from}_to_${R.to}.xlsx`;
  if(!S.dl)return toast("Downloads aren't available here.");
  try{await S.dl.save({filename,data:new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})})}catch(e){if(e&&e.code!=="declined")toast("Couldn't save: "+(e.message||e.code))}
}

/* ---------- Setup ---------- */
function renderSet(){
  const st=S.setup;
  $("#vSet").innerHTML=`<div class="sec"><h2>Peddlers</h2><div class="muted">Commission % is what the peddler keeps from their sales. Leave blank to use the default.</div>
    <div class="set muted" style="font-size:12px"><span>Name</span><span>Commission %</span><span></span></div>
    ${(st.peddlers||[]).map(p=>`<div class="set ${p.gone?"gone":""}"><input data-pn="${p.id}" value="${esc(p.name)}"><input class="n" inputmode="decimal" data-pc="${p.id}" value="${p.comm??""}" placeholder="${num(st.comm)}"><button data-pg="${p.id}">${p.gone?"Bring back":"Remove"}</button></div>`).join("")}
    <div class="set"><input id="newP" placeholder="New peddler's name"><input class="n" id="newPc" inputmode="decimal" placeholder="${num(st.comm)}"><button class="pri" id="addP">Add</button></div>
    <label style="max-width:14em"><span>Default commission %</span><input class="n" id="defC" inputmode="decimal" value="${st.comm??0}"></label></div>
   <div class="sec"><h2>Breads and prices</h2><div class="muted">The price peddlers sell at. A change applies to sheets started after it; today's open sheets keep their price.</div>
    <div class="set muted" style="font-size:12px"><span>Bread</span><span>Price ₱</span><span></span></div>
    ${itemsAll().map(i=>`<div class="set ${i.gone?"gone":""}"><input data-in="${i.id}" value="${esc(i.name)}"><input class="n" inputmode="decimal" data-ip="${i.id}" value="${i.price??""}"><button data-ig="${i.id}">${i.gone?"Bring back":"Remove"}</button></div>`).join("")}
    <div class="set"><input id="newI" placeholder="New bread"><input class="n" id="newIp" inputmode="decimal" placeholder="0.00"><button class="pri" id="addI">Add</button></div>
    <div class="err" id="setErr"></div></div>`;
  const v=$("#vSet");
  v.onchange=e=>{const t=e.target,d=t.dataset;let x;
    if(d.pn&&(x=st.peddlers.find(p=>p.id===d.pn))&&t.value.trim())x.name=t.value.trim();
    else if(d.pc&&(x=st.peddlers.find(p=>p.id===d.pc)))x.comm=t.value.trim()===""?"":num(t.value);
    else if(d.in&&(x=st.items.find(i=>i.id===d.in))&&t.value.trim())x.name=t.value.trim();
    else if(d.ip&&(x=st.items.find(i=>i.id===d.ip))){x.price=num(t.value);const doc=S.days[today()];if(doc)Object.values(doc.peddlers||{}).forEach(r=>{if(r.price&&r.price[x.id]==null)r.price[x.id]=x.price})}
    else if(t.id==="defC")st.comm=num(t.value);
    else return;
    saveSetup()};
  v.onclick=e=>{const d=e.target.dataset;let x;
    if(d.pg&&(x=st.peddlers.find(p=>p.id===d.pg))){x.gone=!x.gone;saveSetup();renderSet()}
    else if(d.ig&&(x=st.items.find(i=>i.id===d.ig))){x.gone=!x.gone;saveSetup();renderSet()}
    else if(e.target.id==="addP"){const n=$("#newP").value.trim();if(!n)return;if((st.peddlers||[]).some(p=>p.name.toLowerCase()===n.toLowerCase()))return $("#setErr").textContent=n+" is already in the list.";
      st.peddlers=st.peddlers||[];st.peddlers.push({id:uid("pd"),name:n,comm:$("#newPc").value.trim()===""?"":num($("#newPc").value)});saveSetup();renderSet()}
    else if(e.target.id==="addI"){const n=$("#newI").value.trim();if(!n)return;if(itemsAll().some(i=>i.name.toLowerCase()===n.toLowerCase()))return $("#setErr").textContent=n+" is already in the list.";
      st.items=st.items||[];st.items.push({id:uid("it"),name:n,price:num($("#newIp").value)});saveSetup();renderSet()}};
}

/* ---------- shell ---------- */
function setTab(t){S.tab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("#vDay").hidden=t!=="day";$("#vRep").hidden=t!=="rep";$("#vSet").hidden=t!=="set";render()}
function render(){
  if(typing()){S.pending=true;return}
  document.querySelectorAll("[data-mgr]").forEach(el=>el.hidden=!S.mgr);
  if(!S.mgr&&S.tab!=="day"){S.tab="day";return setTab("day")}
  if(S.tab==="day")renderDay();else if(S.tab==="rep")renderRep();else renderSet();
}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab)};
setInterval(()=>{if(!S.mgr&&S.day!==today()){S.day=today();render()}},60000);
render();

(async()=>{
  const C=window.claude;
  const [db,user,dl]=C&&C.use?await Promise.all(["db","user","downloads"].map(n=>C.use(n).catch(()=>null))):[null,null,null];
  S.db=db;S.dl=dl;
  if(user){try{const [a,b]=await Promise.all([user.canEdit?user.canEdit():false,user.isOwner?user.isOwner():false]);S.mgr=!!(a||b)}catch(e){}}else S.mgr=true;
  if(!db){const l=lsGet(LS,{});S.setup=Object.assign({items:[],peddlers:[],comm:0},l.setup||{});S.days=l.days||{};S.loaded=true;render();return}
  db.doc("pdl/setup").onSnapshot(s=>{S.setup=Object.assign({items:[],peddlers:[],comm:0},s.exists?s.data():{});render()});
  db.collection("pdl/days").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});
    /* keep this phone's unsaved typing for days waiting to save */
    Object.keys(saveT).forEach(d=>{if(S.days[d]&&saveT[d]&&$("#saved").textContent==="Saving…")m[d]=S.days[d]});
    S.days=m;S.loaded=true;render()});
})();
</script>
