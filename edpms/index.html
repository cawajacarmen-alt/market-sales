<style>

  --display:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

}

  --over:#ff8a7e; --over-soft:#3d1f1c; --warn:#f0b459; --warn-soft:#3a2c14; --ok:#6fd49a; --ok-soft:#1a3324;
  --info:#9db6f0; --info-soft:#1e2944; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --ink:#e6ece9; --muted:#9aa8a2; --line:#2c3833; --soft:#212b27;
  --accent:#5cc49c; --accent-ink:#0d1a15; --accent-soft:#1d3a2f;
  --over:#ff8a7e; --over-soft:#3d1f1c; --warn:#f0b459; --warn-soft:#3a2c14; --ok:#6fd49a; --ok-soft:#1a3324;
  --info:#9db6f0; --info-soft:#1e2944; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 60px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.92rem;font-weight:700}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.sub{color:var(--muted);font-size:.85rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:600 .9rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 auto}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:.8rem}
button.b{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button.b:hover{background:var(--soft)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.p:hover{background:var(--accent);filter:brightness(1.08)}
button.d{color:var(--over)}

.mono,td.n,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.p-none{background:var(--soft);color:var(--muted)}
.p-prep{background:var(--warn-soft);color:var(--warn)}
.p-ready{background:var(--info-soft);color:var(--info)}
.p-up{background:var(--ok-soft);color:var(--ok)}
.p-late{background:var(--over-soft);color:var(--over)}
.p-sub{background:var(--accent-soft);color:var(--accent)}.p-ret{background:var(--warn-soft);color:var(--warn)}
.p-over{background:var(--over-soft);color:var(--over)}

.q.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.q .m{font:800 1.25rem var(--display)}
.q .cut{font-size:.8rem;color:var(--muted)}
.q .cut b{color:var(--ink);font-family:var(--mono);font-weight:600}
.q .count{font-size:.78rem}
.dots{display:flex;gap:4px;flex-wrap:wrap}

.dot.prep{background:var(--warn)}.dot.sub{background:var(--accent)}.dot.ret{background:#c2410c}.dot.ready{background:var(--info)}.dot.up{background:var(--ok)}.dot.late{background:var(--over)}
.grid-tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
tr.over td{background:var(--over-soft)}
tr.over:hover td{background:var(--over-soft);filter:brightness(.97)}
.rm{font-size:.78rem;line-height:1.35}
.rm .o{color:var(--over);font-weight:700}
.rm .k{color:var(--ok);font-weight:600}
.rm .w{color:var(--warn);font-weight:600}
.rm .i{color:var(--muted)}
.doh{font-family:var(--mono);font-size:.76rem;line-height:1.5;white-space:nowrap}
.tag{display:inline-block;font:700 .62rem var(--body);letter-spacing:.04em;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}
.tG{background:#7a3fb0;color:#fff}.tL{background:#5c6a65;color:#fff}.tE{background:#1f6b52;color:#fff}.tS{background:#3a5a9c;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile .v{font:700 1.2rem var(--mono)}
.tile .l{font-size:.72rem;color:var(--muted);font-weight:600}
.tile.bad .v{color:var(--over)}
.note{background:var(--soft);border-radius:8px;padding:9px 11px;font-size:.8rem;color:var(--muted)}
.note b{color:var(--ink)}
.ed{border:2px solid var(--accent);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fgrid .wide{grid-column:1/-1}
.sugg{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;background:var(--panel)}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 9px;font:inherit;color:inherit;cursor:pointer}
.sugg button:hover{background:var(--soft)}
.sugg .s2{font-size:.75rem;color:var(--muted)}

.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;width:110px;display:flex;flex-direction:column;gap:3px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:20;max-width:calc(100% - 32px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 11px;font:600 .78rem var(--body);cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lock{max-width:520px;margin:40px auto;text-align:center}
.ex{font-size:.7rem;font-weight:700;color:var(--warn)}
@media (max-width:560px){h1{font-size:1.15rem}.q .m{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>window.WS_SITE="edpms";
/* Login for the bakery websites. Runs before the app script.
   Logins live in the owner's Google Sheet, tab "Staff logins" (Name, PIN, Sites, Manager). The Sheet script checks them.
   One login per phone covers every site the person may open; it ends at midnight or on Log out.
   Sets window.WS_USER = {name, manager, sites} for the app. A site key may carry a part after a dash (edpms-mercedes = the EDPMS site, Mercedes branch only). Needs WS_SITE (this site's key) defined first. */
(function () {
  var SITE = window.WS_SITE, SK = 'bakery.session', UK = 'bakery.users', SH = 'bakery.sheet';
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var set = function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  var json = function (k, d) { try { return JSON.parse(get(k)) || d; } catch (e) { return d; } };
  var today = function () { return new Date().toLocaleDateString('en-CA'); };
  var allowed = function (sites) { var s = String(sites || '').toLowerCase(); return !s.trim() || /\ball\b/.test(s) || s.split(/[\s,;]+/).some(function (x) { return x === SITE || x.indexOf(SITE + '-') === 0; }); };
  window.WS_SHEET = function () { return get(SH) || ''; };
  window.WS_SET_SHEET = function (u) { set(SH, u || null); };
  window.WS_LOGOUT = function () { set(SK, null); location.reload(); };
  if (!get(SH)) try { // a phone already connected before logins existed: reuse its link
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (!/\.sheet$/.test(k)) continue;
      var v = String(localStorage.getItem(k) || '').replace(/^"|"$/g, ''); if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(v)) { set(SH, v); break; } }
  } catch (e) {}
  var ses = json(SK, null);
  if (ses && ses.day === today() && allowed(ses.sites)) { window.WS_USER = { name: ses.name, manager: !!ses.manager, sites: ses.sites || '' }; try { localStorage.setItem('breadorders.taker', JSON.stringify(ses.name)); } catch (e) {} }
  else if (ses && ses.open && ses.day === today()) { window.WS_USER = null; } // the Sheet script has no logins yet: open as before
  function hash(s) { // small non-reversible check for logging in again without internet on this phone
    var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36);
  }
  function start(name, row) {
    set(SK, JSON.stringify({ name: row.name || name, manager: !!row.manager, sites: row.sites || '', day: today() }));
    location.reload();
  }
  function screen() {
    var css = '#wsgate{position:fixed;inset:0;z-index:100;background:#f4f5f1;display:grid;place-items:center;padding:16px;font:15px system-ui,sans-serif;color:#1a1a1a;overflow:auto}' +
      '#wsgate form{background:#fff;border:1px solid #d6d9d2;border-radius:14px;padding:22px;max-width:360px;width:100%;display:grid;gap:12px}' +
      '#wsgate h1{margin:0;font-size:22px}#wsgate p{margin:0;font-size:13px;color:#555}#wsgate label{display:grid;gap:4px;font-size:13px;font-weight:600;color:#444}' +
      '#wsgate input{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;color:#1a1a1a;background:#fff;min-width:0}' +
      '#wsgate button{font:600 15px system-ui,sans-serif;padding:11px;border-radius:8px;border:0;background:#2f6b3a;color:#fff;cursor:pointer}' +
      '#wsgate .err{color:#b3342b;font-weight:600;font-size:13px;min-height:1em}#wsgate a{color:#2f6b3a;font-size:13px}';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    var g = document.createElement('div'); g.id = 'wsgate';
    var need = !window.WS_SHEET();
    g.innerHTML = '<form autocomplete="off"><h1>' + (document.title || 'Log in') + '</h1>' +
      '<p>Log in with your name and PIN. Ask the owner if you don\'t have one.</p>' +
      '<label>Your name<input id="gName" autocomplete="username" required></label>' +
      '<label>PIN<input id="gPin" type="password" inputmode="numeric" autocomplete="current-password" required></label>' +
      '<div id="gSetup"' + (need ? '' : ' hidden') + '><label>Google Sheet link (owner sets this once per phone)<input id="gUrl" placeholder="https://script.google.com/macros/s/…/exec"></label></div>' +
      '<div class="err" id="gErr"></div><button type="submit">Log in</button>' +
      (need ? '' : '<a href="#" id="gShow">Change the Google Sheet link</a>') + '</form>';
    document.body.appendChild(g);
    var q = function (s) { return g.querySelector(s); };
    if (q('#gShow')) q('#gShow').onclick = function (e) { e.preventDefault(); q('#gSetup').hidden = false; q('#gUrl').value = window.WS_SHEET(); };
    q('#gName').value = json(UK, {}).last || '';
    (q('#gName').value ? q('#gPin') : q('#gName')).focus();
    q('form').onsubmit = function (e) {
      e.preventDefault();
      var name = q('#gName').value.trim(), pin = q('#gPin').value.trim(), url = (q('#gUrl').value || '').trim() || window.WS_SHEET(), err = q('#gErr');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(url)) { err.textContent = 'Paste the Google Sheet link first (it ends with /exec).'; q('#gSetup').hidden = false; return; }
      var cache = json(UK, {}), key = name.toLowerCase();
      var offline = function () {
        var c = cache[key];
        if (c && c.h === hash(key + '|' + pin) && allowed(c.sites)) { start(name, c); return; }
        err.textContent = 'No internet. Connect once to log in on this phone.';
      };
      if (!navigator.onLine) { offline(); return; }
      err.textContent = 'Checking…';
      fetch(url + '?action=login&site=' + encodeURIComponent(SITE) + '&name=' + encodeURIComponent(name) + '&pin=' + encodeURIComponent(pin) + '&t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (j) {
          window.WS_SET_SHEET(url);
          if (!(j.v >= 5)) { set(SK, JSON.stringify({ open: 1, day: today() })); location.reload(); return; } // old script: no logins yet
          if (j.setup) { err.textContent = 'No logins yet. In your Google Sheet open the "Staff logins" tab and add yourself (Name, PIN, Sites: all, Manager: yes).'; return; }
          if (!j.ok) { err.textContent = j.locked ? 'Too many wrong tries. Wait 10 minutes.' : j.site ? 'You don\'t have access to this site.' : 'Wrong name or PIN.'; return; }
          cache[key] = { name: j.name, manager: !!j.manager, sites: j.sites || '', h: hash(key + '|' + pin) }; cache.last = j.name; set(UK, JSON.stringify(cache));
          start(name, j);
        })
        .catch(offline);
    };
  }
  function bar() {
    if (!window.WS_USER) return;
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:40;background:#1a1a1a;color:#fff;border-radius:99px;padding:6px 6px 6px 12px;font:600 13px system-ui,sans-serif;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)';
    b.innerHTML = '<span></span><button style="font:600 12px system-ui,sans-serif;border:0;border-radius:99px;padding:5px 10px;background:#fff;color:#1a1a1a;cursor:pointer">Log out</button>';
    b.firstChild.textContent = window.WS_USER.name + (window.WS_USER.manager ? ' · manager' : '');
    b.lastChild.onclick = window.WS_LOGOUT; document.body.appendChild(b);
  }
  var locked = window.WS_USER === undefined;
  window.WS_LOCKED = locked;
  var go = function () { if (locked) screen(); else bar(); };
  if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
})();

// Shared by the website pages and the Google Sheet script: one saved record per document.
// A record keeps each piece of a document with the time it last changed, so two phones that
// change different orders or receipts on the same day both keep their change.
// rec = {u:{<unit>:{t:<ms>, v:<value>} | {t:<ms>, del:1}}}
// Unit keys: "f" = whole field f; "f.m.<key>" = one entry of map field f; "f.a.<id>" = one item (by id) of array field f.
function wsSplitOf(split, path) {
  for (var i = 0; i < split.length; i++) if (new RegExp(split[i][0]).test(path)) return split[i][1];
  return {};
}
function wsUnits(doc, sp) {
  var u = {};

    var v = doc[k];
    if (sp[k] === 'map' && v && typeof v === 'object' && !Array.isArray(v)) Object.keys(v).forEach(function (s) { u[k + '.m.' + s] = v[s]; });
    else if (sp[k] === 'arr' && Array.isArray(v)) v.forEach(function (x) { if (x && x.id != null) u[k + '.a.' + x.id] = x; });
    else u[k] = v;

}
function wsAssemble(rec, sp) {
  var d = {}, any = false;
  Object.keys(sp).forEach(function (k) { d[k] = sp[k] === 'arr' ? [] : {}; });
  Object.keys((rec && rec.u) || {}).forEach(function (key) {
    var x = rec.u[key]; if (x.del) return; any = true;
    var m = /^(.*?)\.(m|a)\.(.*)$/.exec(key);
    if (m && sp[m[1]] === (m[2] === 'm' ? 'map' : 'arr')) { if (m[2] === 'm') d[m[1]][m[3]] = x.v; else d[m[1]].push(x.v); }
    else d[key] = x.v;
  });
  return any ? d : null;
}
function wsMerge(a, b) {
  var out = { u: {} }, au = (a && a.u) || {}, bu = (b && b.u) || {};
  Object.keys(au).concat(Object.keys(bu)).forEach(function (k) {
    var x = au[k], y = bu[k];
    out.u[k] = !x ? y : !y ? x : (y.t > x.t || (y.t === x.t && JSON.stringify(y) > JSON.stringify(x))) ? y : x;

}
// New record after a page writes `doc` (null = deleted) over `rec`.
function wsStamp(rec, doc, sp, now) {
  var old = (rec && rec.u) || {}, nu = doc ? wsUnits(doc, sp) : {}, out = { u: {} };

}

const MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SRC = {G:"GMAP",E:"MRP",S:"SRP"};

const S = { tab:"sched", stores:DEF_STORES.slice(), sheets:{}, sid:"s1", per:null, filter:"all",
  edit:null, db:null, mgr:true, who:"", allow:null, assets:null, dl:null, ready:false, year:null, imp:null, showUp:false };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const peso = v => v==null||v===""||isNaN(v) ? "" : "₱" + Number(v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { if (v==null||v==="") return null; const n = parseFloat(String(v).replace(/[₱,\s]/g,"")); return isNaN(n)?null:n; };
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
function lastDay(y,m){ return new Date(y,m,0).getDate(); }
function perKey(y,m){ return y+"-"+pad(m); }
function perInfo(key){
  const [y,m]=key.split("-").map(Number); const q=QTR.find(q=>q.m===m);
  const cy = q.cm>m ? y-1 : y;
  return { key, y, m, label: MONL[m-1]+" "+y, short: MON[m-1]+" "+y,
    cutoff: cy+"-"+pad(q.cm)+"-"+pad(lastDay(cy,q.cm)), cutLabel: MON[q.cm-1]+" "+lastDay(cy,q.cm)+", "+cy,
    due: y+"-"+pad(m)+"-"+pad(lastDay(y,m)), dueLabel: MON[m-1]+" "+lastDay(y,m)+", "+y };
}
function periodsOf(y){ return QTR.map(q=>perKey(y,q.m)); }
function nextPeriod(){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
  for (const q of QTR) if (q.m>=m) return perKey(y,q.m);
  return perKey(y+1,2);
}
function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); if(!m) return iso; return MON[m-1]+" "+(d?d+", ":"")+y; }
function daysTo(iso){ const t=new Date(iso+"T23:59:59"); return Math.ceil((t-new Date())/86400000); }

/* Cut-off of the sheet being shown. Until that date, items may be encoded without expiry and quantity. */
let CUT=null;
const early = () => !!CUT && todayISO() <= CUT;
const toCount = r => !r.exp || num(r.qty)==null || num(r.price)==null;
/* ---------- DOH matching ---------- */
const SALTS = /\b(as|hydrochloride|hcl|hydrobromide|sodium|potassium|calcium|magnesium|maleate|mesylate|besylate|besilate|camsylate|camsilate|citrate|tartrate|succinate|fumarate|sulfate|sulphate|phosphate|acetate|bromide|chloride|dihydrate|monohydrate|trihydrate|anhydrous|medoxomil|cilexetil|axetil|disodium|tromethamol|tromethamine|salt|base|equivalent|to)\b/g;
function normGen(s){
  s = String(s||"").toLowerCase().replace(/\([^)]*\)/g," ").replace(SALTS," ").replace(/[^a-z+ ]/g," ");
  return s.split(/\+|\band\b|\bwith\b/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean).sort().join("+");
}
function nums(s){ return (String(s||"").replace(/,/g,"").match(/\d+(\.\d+)?/g)||[]).map(Number).sort((a,b)=>a-b).join(","); }
function form(s){
  s=String(s||"").toLowerCase();
  if (/inj|vial|amp|syringe|i\.?v\b|infusion/.test(s)) return "inj";
  if (/inhal|nebul|respule|\bmdi\b|\bdpi\b|aerosol|turbuhaler|accuhaler|evohaler/.test(s)) return "inh";
  if (/cream|oint|\bgel\b|lotion|topical/.test(s)) return "top";
  if (/syr|susp|elixir|drop|oral sol|solution|granule|sachet|powder for/.test(s)) return "liq";
  if (/tab|caplet|\bcap|capsule/.test(s)) return "tab";
  return "";
}
const REFX = REF.map((r,i)=>{ const g=normGen(r[1]); return {i,src:r[0],gen:r[1],str:r[2],price:r[3],brand:r[4],co:r[5],ng:g,words:g.split("+")[0],nu:nums(r[2]),fm:form(r[2])}; });
const GENS = [...new Set(REFX.map(x=>x.ng))].map(ng=>({ng,parts:ng.split("+")}));
const BRANDS = REFX.filter(x=>x.brand && x.src!=="S").map(x=>({w:x.brand.toLowerCase().replace(/[^a-z0-9 ]/g," ").trim(),ng:x.ng,gen:x.gen})).filter(b=>b.w.length>2);
function brandIn(t){ const f=" "+String(t).toLowerCase().replace(/[^a-z0-9 ]/g," ")+" "; let b=null; for (const x of BRANDS) if (f.includes(" "+x.w+" ") && (!b||x.w.length>b.w.length)) b=x; return b; }
/* EDPMS drug library */
const LIBFORM = /\b(film[- ]coated|chewable|effervescent|orally|disintegrating|dispersible|sustained|extended|modified|delayed|release|enteric|coated|tablet|tablets|capsule|capsules|caplet|softgel|solution|suspension|syrup|drops?|oral|for|injection|ampule|ampoule|vial|bottle|bag|sachet|powder|granules?|cream|ointment|gel|lotion|inhaler|dry|nebules?|respules?|pre-filled|prefilled|syringe|pen|cartridge|nasal|spray|ophthalmic|otic|eye|ear|topical|rectal|suppository|vaginal|emulsion|elixir|lozenge|patch|transdermal|metered|dose|and)\b/g;
const STR_AT = /\s\d[\d,.]*\s*(mg|mcg|µg|g|ml|l|iu|%|meq|mmol|units?|million|billion|cfu|i\.u\.)\b/i;
function libForm(t){
  let f = /caplet/.test(t) ? "tab" : /capsule|\bcap\b|\bcaps\b|softgel/.test(t) ? "cap" : form(t);
  if (/modified|extended|sustained|\bmr\b|\ber\b|\bsr\b|\bxr\b|controlled/.test(t)) f+="-mr";
  return f;
}
function libKey(name, strip){
  const t=String(name||"").toLowerCase().replace(/\s+/g," ").trim();
  const m=t.match(STR_AT); const gpart = m ? t.slice(0,m.index) : t; const spart = m ? t.slice(m.index) : "";
  let g=gpart.replace(/\([^)]*\)/g," ");
  if (strip) g=g.replace(SALTS," ");
  g=g.replace(LIBFORM," ").split("+").map(x=>x.replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()).filter(Boolean).sort().join("+");
  if (!g) return null;
  return g+"|"+nums(spart)+"|"+libForm(t);
}
const LIBSET = new Set(LIB.map(n=>n.toLowerCase()));
const LIBIDX = new Map(), LIBIDX2 = new Map();
LIB.forEach((n,i)=>{ for (const [M,k] of [[LIBIDX,libKey(n)],[LIBIDX2,libKey(n,true)]]) if (k){ if(!M.has(k)) M.set(k,[]); M.get(k).push(i); } });
const inLib = name => LIBSET.has(String(name||"").trim().toLowerCase());
function libSuggest(name){
  if (!name || inLib(name)) return null;
  let k=libKey(name), hit=k&&LIBIDX.get(k);
  if (!hit){ k=libKey(name,true); hit=k&&LIBIDX2.get(k); }
  return hit && hit.length===1 ? LIB[hit[0]] : null;
}
function sameDrug(ng,nu,fm,x){ return x.ng===ng && x.nu===nu && (!fm||!x.fm||fm===x.fm); }
function matchRow(r){
  let ng, nu, fm;
  if (r.lg){ ng=normGen(r.lg); nu=nums(r.ls); fm=form(r.ls); }
  else {
    const t = String(r.drug||"").toLowerCase();
    if (!t.trim()) return [];
    // the library generic whose every ingredient appears in the typed name; most specific wins
    const flat = " "+t.replace(/\([^)]*\)/g," ").replace(SALTS," ").replace(/[^a-z]+/g," ")+" ";
    let best=null;
    for (const g of GENS){ if (g.parts.every(p=>flat.includes(" "+p+" ")) && (!best || g.ng.length>best.length)) best=g.ng; }
    if (!best){ const bx=brandIn(t); if (!bx) return []; best=bx.ng; r._brandAs=bx; }
    ng=best; nu=nums(t); fm=form(t);
  }
  let hits = REFX.filter(x=>sameDrug(ng,nu,fm,x));
  if (!hits.length && nu) hits = REFX.filter(x=>x.ng===ng && x.nu.split(",").filter(Boolean).every(n=>nu.split(",").includes(n)) && x.nu && (!fm||!x.fm||fm===x.fm));
  return hits;
}
function wordsOf(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2 && !/^(inc|corp|corporation|pharma|pharmaceuticals?|philippines|phils?|labs?|laboratories|ltd|co|the|and|asia|pacific|healthcare|lifesciences)$/.test(w)); }
function brandOK(r,x){
  const mine = wordsOf((r.brand||"")+" "+(r.mfr||""));
  if (!mine.length) return false;
  const theirs = wordsOf((x.brand||"")+" "+(x.co||""));
  return theirs.some(w=>mine.includes(w));
}
function check(r){
  delete r._brandAs; const hits = matchRow(r);
  const brandAs = r._brandAs; delete r._brandAs;
  const lib = inLib(r.drug), libFix = lib ? null : libSuggest(r.drug);
  const price = num(r.price);
  const res = { hits, brandAs, lib, libFix, caps:{}, applied:[], skipped:[], over:[], status:"none" };
  for (const x of hits){
    let applies;
    if (x.src==="S") applies = true;
    else if (x.src==="E") applies = !x.brand || brandOK(r,x);
    else applies = brandOK(r,x);
    (applies?res.applied:res.skipped).push(x);
    if (applies && x.price!=null) res.caps[x.src] = res.caps[x.src]==null ? x.price : Math.min(res.caps[x.src], x.price);
  }
  for (const k of ["G","E","S"]) if (res.caps[k]!=null && price!=null && price > res.caps[k] + 0.004) res.over.push({src:k,cap:res.caps[k],by:price-res.caps[k]});
  if (!hits.length) res.status = "noref";
  else if (price==null) res.status = "noprice";
  else if (res.over.length) res.status = "over";
  else if (!Object.keys(res.caps).length) res.status = "notapplied";
  else res.status = "ok";
  return res;
}
function remarkText(r, c){
  c = c || check(r);
  const parts=[];
  if (c.status==="over") for (const o of c.over) parts.push("ABOVE "+SRC[o.src]+" "+peso(o.cap)+" by "+peso(o.by)+(o.src==="S"?" (highest SRP)":""));
  else if (c.status==="ok") parts.push("Within DOH price ("+Object.keys(c.caps).map(k=>SRC[k]).join(", ")+")");
  else if (c.status==="noprice" && !early()) parts.push("No price entered");
  else if (c.status==="noref") parts.push("Not in GMAP / MRP / SRP lists");
  const sk = c.skipped.filter(x=>!c.caps[x.src]);
  if (sk.length){ const by={}; sk.forEach(x=>{ (by[x.src]=by[x.src]||new Set()).add([x.brand,x.co].filter(Boolean).join(" / ")); });
    for (const k in by) parts.push(SRC[k]+" price is for "+[...by[k]].join("; ")+" only"); }
  if (!c.lib) parts.push(c.libFix ? "Use EDPMS library name: "+c.libFix : "Not an exact EDPMS drug library name");
  if (c.brandAs) parts.push("Write the generic name ("+c.brandAs.gen+") in the drug name, not the brand");
  if (early() && toCount(r)) parts.push("Enter expiry, quantity and price on "+fmtDate(CUT));
  else { if (!r.exp) parts.push("No expiry date"); else if (r.exp < todayISO()) parts.push("Expired");
    if (num(r.qty)==null) parts.push("No quantity"); }
  return parts.join(". ");
}
function remarkHTML(r,c){
  c = c || check(r);
  const h=[];
  if (c.status==="over") h.push(...c.over.map(o=>`<span class="o">Above ${SRC[o.src]} ${peso(o.cap)} by ${peso(o.by)}</span>`));
  else if (c.status==="ok") h.push(`<span class="k">Within DOH price</span>`);
  else if (c.status==="noprice" && !early()) h.push(`<span class="w">No price entered</span>`);
  else if (c.status==="noref") h.push(`<span class="i">Not in GMAP / MRP / SRP lists</span>`);
  const sk = c.skipped.filter(x=>!c.caps[x.src]);
  if (sk.length){ const by={}; sk.forEach(x=>{ (by[x.src]=by[x.src]||new Set()).add(x.brand||x.co); });
    for (const k in by) h.push(`<span class="i">${SRC[k]} is for ${esc([...by[k]].join(", "))} only</span>`); }
  if (!c.lib) h.push(c.libFix ? `<span class="w">Library name: ${esc(c.libFix)}</span>` : `<span class="w">Not an exact EDPMS library name</span>`);
  if (c.brandAs) h.push(`<span class="w">Use the generic name: ${esc(c.brandAs.gen)}</span>`);
  if (early() && toCount(r)) h.push(`<span class="i">Count on ${esc(fmtDate(CUT))}</span>`);
  else { if (!r.exp) h.push(`<span class="w">No expiry</span>`); else if (r.exp < todayISO()) h.push(`<span class="o">Expired</span>`);
    if (num(r.qty)==null) h.push(`<span class="w">No quantity</span>`); }
  return h.join("<br>");
}
function dohCell(c){
  const out=[];
  for (const k of ["G","E","S"]) if (c.caps[k]!=null) out.push(`<span class="tag t${k}">${SRC[k]}</span>${peso(c.caps[k])}`);
  return out.join("<br>") || `<span class="sub">–</span>`;
}

/* ---------- storage ---------- */
function sheetId(sid,per){ return sid+"_"+per; }
function getSheet(sid,per,create){
  const id=sheetId(sid,per);
  if (!S.sheets[id] && create) S.sheets[id] = {id, store:sid, period:per, rows:[], status:"prep", up:{}, updatedAt:""};
  return S.sheets[id];
}
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({stores:S.stores, sheets:S.sheets})); }catch(e){} }
function lsLoad(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(d){ if(d.stores) S.stores=d.stores; if(d.sheets) S.sheets=d.sheets; } }catch(e){} }
const pending = new Set(); let saveT=null;
function saveSheet(sh){
  sh.updatedAt = new Date().toISOString();
  pending.add(sh.id); setSaveState("Saving…");
  clearTimeout(saveT); saveT=setTimeout(flush, 500);
  lsSave();
}
async function flush(){
  const ids=[...pending]; pending.clear();
  if (!S.db){ setSaveState("Saved on this device only"); return; }
  try{
    for (const id of ids){ const sh=S.sheets[id];
      if (sh) await S.db.doc("edpms/setup/sheets/"+id).set(JSON.parse(JSON.stringify(sh)));
      else await S.db.doc("edpms/setup/sheets/"+id).delete();
    }
    setSaveState("All changes saved");
  }catch(e){ setSaveState("Could not save: "+(e.message||e.code)); }
}
async function saveSetup(){
  lsSave();
  if (!S.db) return;
  try{ await S.db.doc("edpms/setup").set({stores:S.stores}); setSaveState("All changes saved"); }
  catch(e){ setSaveState("Could not save: "+(e.message||e.code)); }
}
function setSaveState(t){ const el=$("#saveState"); if (el) el.textContent=t; }

/* ---------- status ---------- */
function sheetStatus(sid,per){
  const sh=getSheet(sid,per), P=perInfo(per);
  if (sh && sh.status==="up") return {k:"up",t:"Uploaded"+(sh.up&&sh.up.date?" "+fmtDate(sh.up.date):"")};
  const late = daysTo(P.due) < 0;
  if (!sh || !sh.rows.length) return late ? {k:"late",t:"Not uploaded"} : {k:"none",t:"Not started"};
  const over = sh.rows.filter(r=>check(r).status==="over").length;
  if (late) return {k:"late",t:"Late"+(over?" · "+over+" above DOH":"")};
  if (sh.status==="ok"||sh.status==="ready") return {k:"ready",t:"Approved · ready to upload"+(over?" · "+over+" above":"")};
  if (sh.status==="sub") return {k:"sub",t:"Submitted for review"+(over?" · "+over+" above":"")};
  if (sh.status==="ret") return {k:"ret",t:"Returned to staff"+(over?" · "+over+" above":"")};
  return {k:"prep",t:"Preparing · "+sh.rows.length+" items"+(over?" · "+over+" above":"")};
}
const activeStores = () => S.stores.filter(s=>!s.gone);
const myStores = () => activeStores().filter(s=>!S.allow||S.allow.includes(s.id));
const canWork = sh => S.mgr || !sh || ["prep","ret",undefined,""].includes(sh.status);

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  const v=$("#view");
  if (S.tab==="sched") v.innerHTML = viewSched();
  else if (!S.mgr && !myStores().length) v.innerHTML = `<div class="panel lock"><h2>No branch yet</h2><div class="sub">Ask the manager to add your branch to your login (for example edpms-mercedes).</div></div>`;
  else if (S.tab==="sheet") v.innerHTML = viewSheet();
  else v.innerHTML = viewRules();
  if (S.tab==="sheet" && S.edit) wireEditor();
}

function viewSched(){
  const y=S.year, nx=nextPeriod();
  const stores=myStores();
  let h=`<div class="panel">
    <div class="row"><h2 class="grow">Upload schedule ${y}</h2>
      <button class="b sm" data-act="year" data-d="-1">◀ ${y-1}</button><button class="b sm" data-act="year" data-d="1">${y+1} ▶</button></div>
    <div class="sub">Machica has 2 or more branches, so every branch uploads quarterly. Each upload uses the inventory on the cut-off date.</div>
    <div class="quarters">`;
  for (const per of periodsOf(y)){
    const P=perInfo(per), dl=daysTo(P.due);
    const st=stores.map(s=>sheetStatus(s.id,per));
    const done=st.filter(x=>x.k==="up").length;

      <div class="dots">${st.map((x,i)=>`<span class="dot ${x.k}" title="${esc(stores[i].name)}: ${esc(x.t)}"></span>`).join("")}</div>
      <div class="count">${done} of ${stores.length} branches uploaded${when?" · "+when:""}</div>
    </button>`;
  }
  h+=`</div></div>`;
  // branch × quarter table
  h+=`<div class="panel"><h2>Branches</h2><div class="grid-tbl"><table><thead><tr><th>Branch</th>${periodsOf(y).map(p=>`<th>${MONL[perInfo(p).m-1]}</th>`).join("")}</tr></thead><tbody>`;
  for (const s of stores){
    h+=`<tr><td><b>${esc(s.name)}</b></td>`;
    for (const per of periodsOf(y)){ const x=sheetStatus(s.id,per);
      h+=`<td><button class="b sm" style="border:0;padding:0;background:none" data-act="open" data-sid="${s.id}" data-per="${per}"><span class="pill p-${x.k}">${esc(x.t)}</span></button></td>`; }
    h+=`</tr>`;
  }
  h+=`</tbody></table></div>
    ${S.mgr?`<details><summary class="sub" style="cursor:pointer">Rename, add or hide branches</summary>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
    ${S.stores.map(s=>`<div class="row"><input id="sn_${s.id}" value="${esc(s.name)}" data-act="sname" data-sid="${s.id}" class="grow">
      <button class="b sm" data-act="shide" data-sid="${s.id}">${s.gone?"Show":"Hide"}</button></div>`).join("")}
    <div class="row"><input id="newStore" placeholder="New branch name" class="grow"><button class="b sm" data-act="sadd">Add branch</button></div>
    </div></details>`:""}</div>`;
  h+=`<div class="note"><b>Penalties under DOH AO 2018-0020:</b> 1st offense written warning, 2nd ₱10,000 to ₱50,000, up to ₱200,000 to ₱500,000 and blacklisting on the 4th, plus possible license suspension. Keep the proof of every upload on its sheet.</div>`;
  return h;
}

function filtered(sh){
  return sh.rows.map((r,i)=>({r,i,c:check(r)})).filter(o=>{
    const f=S.filter;
    if (f==="over") return o.c.status==="over";
    if (f==="noref") return o.c.status==="noref";
    if (f==="miss") return (!early() && toCount(o.r)) || o.c.brandAs || !o.c.lib;
    if (f==="count") return toCount(o.r);
    if (f==="exp") return o.r.exp && o.r.exp < todayISO();
    return true;
  });
}

  CUT=perInfo(S.per).cutoff;
  const per=S.per, P=perInfo(per), store=S.stores.find(s=>s.id===S.sid)||S.stores[0];
  const sh=getSheet(S.sid,per);
  const rows=sh?sh.rows:[];
  const checks=rows.map(r=>check(r));
  const n={all:rows.length, over:checks.filter(c=>c.status==="over").length, noref:checks.filter(c=>c.status==="noref").length,
    miss:rows.filter((r,k)=>(!early()&&toCount(r))||checks[k].brandAs||!checks[k].lib).length, count:rows.filter(toCount).length, exp:rows.filter(r=>r.exp&&r.exp<todayISO()).length};
  const yrs=[S.year-1,S.year,S.year+1];
  const pers=yrs.flatMap(periodsOf);
  const st=sheetStatus(S.sid,per);
  let h=`<div class="panel">
    <div class="row">
      <label class="f">Branch<select id="selStore" data-act="selstore">${myStores().map(s=>`<option value="${s.id}" ${s.id===S.sid?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
      <label class="f">Upload<select id="selPer" data-act="selper">${pers.map(p=>`<option value="${p}" ${p===per?"selected":""}>${perInfo(p).label}</option>`).join("")}</select></label>
      <div class="grow"></div>
      <span class="pill p-${st.k}">${esc(st.t)}</span>
    </div>

function knownMfrs(){
  const seen=new Map();
  const add=m=>{ m=(m||"").trim(); if(m && !seen.has(m.toLowerCase())) seen.set(m.toLowerCase(),m); };
  for (const id in S.sheets) for (const r of (S.sheets[id].rows||[])) add(r.mfr);
  for (const x of REFX) if (x.src!=="S") add(x.co);
  return [...seen.values()].sort((a,b)=>a.localeCompare(b));
}
function brandMfr(){
  const m=new Map();
  for (const id in S.sheets) for (const r of (S.sheets[id].rows||[])) if (r.brand){ const k=r.brand.trim().toLowerCase(); if(!m.has(k) || (!m.get(k).mfr && r.mfr)) m.set(k,{brand:r.brand.trim(),mfr:(r.mfr||"").trim()}); }
  return m;
}

function suggest(q){
  const box=$("#e_sugg"); q=q.trim().toLowerCase();
  if (q.length<2){ box.innerHTML=""; return; }
  const terms=q.split(/\s+/);
  const lib=LIB.filter(n=>{ const t=n.toLowerCase(); return terms.every(w=>t.includes(w)); }).slice(0,25);
  const hits=REFX.filter(x=>{ const t=(x.gen+" "+x.str+" "+x.brand+" "+x.co).toLowerCase(); return terms.every(w=>t.includes(w)); }).slice(0,15);
  if (!hits.length && !lib.length){ box.innerHTML=`<div class="sub">Not found in the EDPMS drug library or the DOH price lists.</div>`; return; }
  box.innerHTML=`<div class="sugg">${lib.map(n=>`<button data-act="picklib" data-v="${esc(n)}"><span class="tag tL">LIBRARY</span><b>${esc(n)}</b></button>`).join("")}${hits.map(x=>`<button data-act="pick" data-x="${x.i}"><span class="tag t${x.src}">${SRC[x.src]}</span><b>${esc(x.gen)}</b> ${esc(x.str)} · <span class="mono">${peso(x.price)}</span><div class="s2">${esc([x.brand,x.co].filter(Boolean).join(" / ")||"Any brand or generic")}</div></button>`).join("")}</div>`;
}

/* ---------- import parsing ---------- */
const COLS = [
  ["brand",/brand/],["mfr",/manufact|company|maker|labeler|mfr|marketed/],["exp",/expir|^exp/],["lot",/\blot\b|batch/],
  ["edpms",/edpms|monitored/],["str",/strength|dosage|form/],
  ["qty",/qty|quantity|on ?hand|stock|balance|pcs|pieces|count/],
  ["price",/sell|price|retail|^our|srp/],["drug",/generic|drug|product|item|medicine|description|name/]];
const SKIP = /value|cost|doh|gmap|mrp|ceiling|max|total|amount|lowest|highest|diff|%/;
function mapHeader(hdr){
  const map={}; const used=new Set();
  hdr.forEach((h,ci)=>{ const t=String(h||"").toLowerCase().trim(); if(!t) return;
    for (const [k,re] of COLS){ if (used.has(k)) continue; if (!re.test(t)) continue; if ((k==="price"||k==="qty") && SKIP.test(t) && !/sell/.test(t)) continue; map[k]=ci; used.add(k); break; } });
  return map;
}
function parseDate(v){
  if (v==null||v==="") return "";
  if (v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
  if (typeof v==="number" && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
  const s=String(v).trim(); let m;
  if ((m=s.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?/))) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]||lastDay(+m[1],+m[2]));
  if ((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))){ let y=+m[3]; if(y<100) y+=2000; return y+"-"+pad(m[1])+"-"+pad(m[2]); }
  if ((m=s.match(/^(\d{1,2})[-/.](\d{2,4})$/))){ let y=+m[2]; if(y<100) y+=2000; return y+"-"+pad(m[1])+"-"+pad(lastDay(y,+m[1])); }
  if ((m=s.match(/^([a-z]{3})[a-z]*\.?\s*(\d{1,2},?\s*)?(\d{4})$/i))){ const mi=MON.findIndex(x=>x.toLowerCase()===m[1].toLowerCase()); if(mi>=0){ const d=m[2]?parseInt(m[2]):lastDay(+m[3],mi+1); return m[3]+"-"+pad(mi+1)+"-"+pad(d); } }
  const d=new Date(s); if(!isNaN(d)) return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return "";
}
const truthy = v => /^(y|yes|true|1|✓|✔|x|edpms)/i.test(String(v||"").trim());
function rowsFromAoa(aoa){
  let hi=-1, map=null;
  for (let i=0;i<Math.min(15,aoa.length);i++){ const m=mapHeader(aoa[i]); if (m.drug!=null && Object.keys(m).length>=2){ hi=i; map=m; break; } }
  let body;
  if (hi<0){ map={drug:0,brand:1,mfr:2,exp:3,qty:4,price:5}; body=aoa; } else body=aoa.slice(hi+1);
  const g=(row,k)=>map[k]==null?"":row[map[k]];
  const rows=body.map(row=>{
    let drug=String(g(row,"drug")||"").trim(); const str=String(g(row,"str")||"").trim();
    if (str && !drug.toLowerCase().includes(str.toLowerCase())) drug=(drug+" "+str).trim();
    return {drug, brand:String(g(row,"brand")||"").trim(), mfr:String(g(row,"mfr")||"").trim(), exp:parseDate(g(row,"exp")),
      qty:num(g(row,"qty")), price:num(g(row,"price")), _ed: map.edpms!=null ? truthy(g(row,"edpms")) : true};
  }).filter(r=>r.drug && !/^total/i.test(r.drug));
  const cols=Object.keys(map).map(k=>({drug:"drug",brand:"brand",mfr:"manufacturer",exp:"expiry",lot:"lot",edpms:"EDPMS",str:"strength",qty:"quantity",price:"price"}[k]));
  return {rows, cols:hi<0?["(no header, fixed order)"]:cols, hasEd: map.edpms!=null};
}
function combine(rows){
  const m=new Map();
  for (const r of rows){ const k=[r.drug,r.brand,r.mfr].map(s=>String(s||"").toLowerCase()).join("|");
    const o=m.get(k); if(!o){ m.set(k,{...r}); continue; }
    o.qty=(o.qty||0)+(r.qty||0); if (r.exp && (!o.exp || r.exp<o.exp)) o.exp=r.exp; if (r.price!=null) o.price=r.price; }
  return [...m.values()];
}
function cleanRow(r){ const o={id:uid(),drug:libSuggest(r.drug)||r.drug,brand:r.brand||"",mfr:r.mfr||"",exp:r.exp||"",qty:r.qty??null,price:r.price??null}; if(r.lg){o.lg=r.lg;o.ls=r.ls;} return o; }
function readFile(f){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(rd.result),{type:"array",cellDates:true});
      let names=wb.SheetNames;
      const pref=names.find(n=>/lots? on hand/i.test(n))||names.find(n=>/by product/i.test(n))||names.find(n=>/stock/i.test(n));
      const order=pref?[pref,...names.filter(n=>n!==pref)]:names;
      let best=null;
      for (const n of order){ const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}); const res=rowsFromAoa(aoa);
        if (res.rows.length && !res.cols[0].startsWith("(")){ best={...res,sheet:n}; break; } if(!best && res.rows.length) best={...res,sheet:n}; }
      if (!best){ toast("No rows found in that file"); return; }
      S.imp={...best, onlyEd:best.hasEd, combine:false}; render();
    }catch(e){ toast("Could not read that file: "+e.message); }
  };
  rd.readAsArrayBuffer(f);
}
function readPaste(){
  const t=$("#i_paste").value; if(!t.trim()){ toast("Paste some rows first"); return; }
  const lines=t.split(/\r?\n/).filter(l=>l.trim());
  const aoa=lines.map(l=>l.includes("\t")?l.split("\t"):l.split(/[;,](?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s=>s.replace(/^"|"$/g,"")));
  const res=rowsFromAoa(aoa);
  S.imp={...res, sheet:"", onlyEd:false, combine:false, paste:t}; render();
}

/* ---------- Excel export ---------- */
function sheetAoa(sh){
  const st=S.stores.find(s=>s.id===sh.store), P=perInfo(sh.period); CUT=P.cutoff;
  const aoa=[["Machica Pharmaceuticals · EDPMS upload"],["Branch",st?st.name:sh.store],["Upload",P.label],["Inventory as of",P.cutLabel],[],
    ["#","Name of Drug in the Library (Generic Name)","Brand Name","Manufacturer","Expiry Date","GMAP Price","MRP","SRP (highest)","Quantity","Our Price","Remarks"]];
  sh.rows.forEach((r,i)=>{ const c=check(r);
    aoa.push([i+1,r.drug,r.brand,r.mfr,r.exp?new Date(r.exp+"T00:00:00"):"",c.caps.G??"",c.caps.E??"",c.caps.S??"",num(r.qty)??"",num(r.price)??"",remarkText(r,c)]); });
  return aoa;
}
function makeWs(aoa){
  const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true});
  ws["!cols"]=[{wch:5},{wch:40},{wch:18},{wch:22},{wch:12},{wch:11},{wch:11},{wch:12},{wch:10},{wch:11},{wch:60}];
  for (const k in ws){ if(k[0]==="!") continue; const c=ws[k], a=XLSX.utils.decode_cell(k);
    if (c.t==="d") c.z="yyyy-mm-dd"; else if (c.t==="n" && a.r>5 && [5,6,7,9].includes(a.c)) c.z="#,##0.00"; }
  return ws;
}
async function saveXlsx(wb, name){
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  if (!S.dl){ toast("Downloads are not available in this view"); return; }
  try{ await S.dl.save({filename:name, data:new Uint8Array(out)}); toast("Excel ready"); }
  catch(e){ if (e && e.code!=="declined") toast("Download failed: "+(e.message||e.code)); }
}
function safeName(s){ return String(s).replace(/[\\/?*[\]:]/g," ").slice(0,31); }
function exportOne(){
  const sh=getSheet(S.sid,S.per); if(!sh) return;
  const wb=XLSX.utils.book_new(); const st=S.stores.find(s=>s.id===S.sid);
  XLSX.utils.book_append_sheet(wb, makeWs(sheetAoa(sh)), safeName(st.name));
  saveXlsx(wb, "EDPMS_"+st.name.replace(/\s+/g,"_")+"_"+S.per+".xlsx");
}
function exportAll(){
  const per = S.tab==="sheet" ? S.per : nextPeriod();
  const wb=XLSX.utils.book_new(); const P=perInfo(per);
  const sum=[["EDPMS upload "+P.label+" · inventory as of "+P.cutLabel],[],["Branch","Status","Items","Above DOH price","Not in DOH lists","Date uploaded","Reference no."]];
  let any=false;
  for (const s of activeStores()){
    const sh=getSheet(s.id,per); const st=sheetStatus(s.id,per);
    const rows=sh?sh.rows:[]; const cs=rows.map(check);
    sum.push([s.name, st.t, rows.length, cs.filter(c=>c.status==="over").length, cs.filter(c=>c.status==="noref").length, sh&&sh.up&&sh.up.date||"", sh&&sh.up&&sh.up.ref||""]);
  }
  const ws0=XLSX.utils.aoa_to_sheet(sum); ws0["!cols"]=[{wch:16},{wch:30},{wch:8},{wch:16},{wch:16},{wch:14},{wch:20}];
  XLSX.utils.book_append_sheet(wb, ws0, "Summary");
  for (const s of activeStores()){ const sh=getSheet(s.id,per); if (sh && sh.rows.length){ any=true; XLSX.utils.book_append_sheet(wb, makeWs(sheetAoa(sh)), safeName(s.name)); } }
  if (!any) toast("No branch has items for "+P.label+" yet; the file has the summary only");
  saveXlsx(wb, "EDPMS_all_branches_"+per+".xlsx");
}

/* ---------- proof upload ---------- */
async function shrink(file,max=1800,q=.85){
  if (!file.type.startsWith("image/")) return file;
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",q));
}
async function addProof(files){
  const sh=getSheet(S.sid,S.per,true); sh.up=sh.up||{}; sh.up.proof=sh.up.proof||[];
  for (const f of files){
    try{ setSaveState("Uploading proof…");
      if (!S.assets){ if (!f.type.startsWith("image/")) { toast("Add a screenshot or photo (PDF is not supported here)"); continue; }
        const b=await shrink(f,1300,.7); const data=await new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(b); });
        sh.up.proof.push({id:uid(), data, name:f.name}); continue; }
      const b=await shrink(f); const r=await S.assets.upload(b);
      sh.up.proof.push({id:r.id, pdf:f.type==="application/pdf", name:f.name}); }
    catch(e){ toast("Could not upload "+f.name+": "+(e.message||e.code)); }
  }
  saveSheet(sh); render();
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); const tab=e.target.closest(".tabs button");
  if (tab){ S.tab=tab.dataset.tab; S.edit=null; render(); return; }
  if (e.target.id==="btnAll"){ if (S.mgr) exportAll(); return; }
  if (!t) return;
  const a=t.dataset.act;
  if (["selstore","selper","status","upf","upfile","ifile","iopt","sname"].includes(a)) return;
  const sh=()=>getSheet(S.sid,S.per,true);
  switch(a){
    case "year": S.year+= +t.dataset.d; render(); break;
    case "openper": S.per=t.dataset.per; S.tab="sheet"; S.edit=null; render(); break;
    case "open": S.sid=t.dataset.sid; S.per=t.dataset.per; S.tab="sheet"; S.edit=null; render(); break;
    case "filter": S.filter=t.dataset.f; render(); break;
    case "add": S.imp=null; S.edit={i:null, r:{id:uid(),drug:"",brand:"",mfr:"",exp:"",qty:null,price:null}}; render(); break;
    case "editrow": { const r=getSheet(S.sid,S.per).rows[+t.dataset.i]; S.imp=null; S.edit={i:+t.dataset.i, r:JSON.parse(JSON.stringify(r))}; render(); $("#ed").scrollIntoView({behavior:"smooth",block:"start"}); break; }
    case "pick": { const x=REFX[+t.dataset.x]; readEditor(); const r=S.edit.r;
      r.lg=x.gen; r.ls=x.str; r.drug=(x.gen+" "+x.str).trim();
      if (x.src!=="S"){ if(!r.brand && x.brand) r.brand=x.brand; if(!r.mfr && x.co) r.mfr=x.co; }
      render(); break; }
    case "picklib": readEditor(); S.edit.r.drug=t.dataset.v; delete S.edit.r.lg; delete S.edit.r.ls; render(); break;
    case "lower": readEditor(); S.edit.r.price=+t.dataset.v; render(); break;
    case "esave": case "esavenext": { const r=readEditor(); if(!r.drug){ toast("Enter the drug name"); return; }
      const s=sh(); if (S.edit.i==null){ if (S.edit.after!=null && S.edit.after<s.rows.length) s.rows.splice(S.edit.after+1,0,r); else s.rows.push(r); } else s.rows[S.edit.i]=r;
      saveSheet(s); S.edit = a==="esavenext" ? {i:null, r:{id:uid(),drug:"",brand:"",mfr:"",exp:"",qty:null,price:null}} : null;
      render(); toast("Item saved"+(a==="esavenext"?". Add the next one.":"")); if (S.edit) { const d=$("#e_drug"); if (d) d.focus(); } break; }
    case "copyrow": { const i=+t.dataset.i; startCopy(getSheet(S.sid,S.per).rows[i], i); break; }
    case "ecopy": { const i=S.edit.i; startCopy(readEditor(), i); break; }
    case "countmode": S.count=!S.count; S.edit=null; S.imp=null; render(); break;
    case "ecancel": S.edit=null; render(); break;
    case "edel": readEditor(); S.edit.confirmDel=true; render(); break;
    case "edelno": readEditor(); S.edit.confirmDel=false; render(); break;
    case "edelyes": { const s=sh(); s.rows.splice(S.edit.i,1); saveSheet(s); S.edit=null; render(); toast("Item removed"); break; }
    case "imp": S.edit=null; S.imp=S.imp?null:{}; render(); break;
    case "impclose": S.imp=null; render(); break;
    case "ipaste": readPaste(); break;
    case "iadd": case "ireplace": {
      const im=S.imp; let rows=im.rows.filter(r=>r.drug && (!im.onlyEd||r._ed)); if (im.combine) rows=combine(rows);
      const s=sh(); const add=rows.map(cleanRow);
      s.rows = a==="iadd" ? s.rows.concat(add) : add;
      saveSheet(s); S.imp=null; S.filter="all"; render(); toast(add.length+" items "+(a==="iadd"?"added":"loaded")); break; }
    case "copyprev": {
      const all=[S.year-1,S.year,S.year+1].flatMap(periodsOf); const idx=all.indexOf(S.per);
      let src=null; for (let k=idx-1;k>=0;k--){ const p=getSheet(S.sid,all[k]); if(p&&p.rows.length){ src=p; break; } }
      if (!src){ toast("No earlier upload with items for this branch"); return; }
      const s=sh(); const key=r=>(r.drug+"|"+r.brand+"|"+(r.mfr||"")).toLowerCase(); const have=new Map(); for (const r of s.rows) have.set(key(r),(have.get(key(r))||0)+1);
      const add=src.rows.filter(r=>{ const n=have.get(key(r))||0; if (n>0){ have.set(key(r),n-1); return false; } return true; }).map(r=>({...cleanRow(r),id:uid(),exp:"",qty:null}));
      s.rows=s.rows.concat(add); saveSheet(s); render(); toast(add.length+" items copied from "+perInfo(src.period).label+". Enter expiry and quantity as of "+perInfo(S.per).cutLabel+".");
      break; }
    case "xls": exportOne(); break;
    case "submit": { const s=sh(); s.status="sub"; s.sub={by:S.who||"Staff",at:new Date().toISOString()}; saveSheet(s); render(); toast("Sent to the manager for review"); break; }
    case "takeback": { const s=sh(); if (s.status!=="sub"){ toast("The manager already reviewed this sheet"); render(); return; } s.status="prep"; s.sub={...(s.sub||{}), back:{by:S.who||"Staff",at:new Date().toISOString()}}; delete s.sub.at; saveSheet(s); render(); toast("Taken back. You can add and edit items again."); break; }
    case "approve": case "return": { const s=sh(); const note=($("#r_note")||{}).value||""; s.status=a==="approve"?"ok":"ret"; s.rev={by:S.who||"Manager",at:new Date().toISOString(),ok:a==="approve",note:note.trim()}; saveSheet(s); render(); toast(a==="approve"?"Approved":"Returned to staff"); break; }
    case "libfixall": { const s=sh(); let k=0; s.rows.forEach(r=>{ const f=libSuggest(r.drug); if(f){ r.drug=f; delete r.lg; delete r.ls; k++; } }); saveSheet(s); render(); toast(k+" names changed to the EDPMS library name"); break; }
    case "uselib": readEditor(); S.edit.r.drug=t.dataset.v; delete S.edit.r.lg; delete S.edit.r.ls; render(); break;
    case "clear": S.clearAsk=true; render(); break;
    case "clearno": S.clearAsk=false; render(); break;
    case "clearyes": { const s=sh(); s.rows=[]; saveSheet(s); S.clearAsk=false; render(); toast("Sheet cleared"); break; }
    case "delproof": { const s=sh(); const p=s.up.proof.splice(+t.dataset.k,1)[0]; saveSheet(s); render();
      if (p && S.assets && !p.data){ try{ await S.assets.delete(p.id); }catch(e){} } break; }
    case "shide": { const st=S.stores.find(s=>s.id===t.dataset.sid); st.gone=!st.gone; saveSetup(); if (S.sid===st.id && st.gone) S.sid=activeStores()[0]?.id; render(); break; }
    case "sadd": { const n=$("#newStore").value.trim(); if(!n) return; let k=1; while(S.stores.some(s=>s.id==="s"+k)) k++; S.stores.push({id:"s"+k,name:n}); saveSetup(); render(); break; }
  }
});
document.addEventListener("input", e=>{
  const t=e.target; if (!t.dataset || t.dataset.ci==null) return;
  const s=getSheet(S.sid,S.per); if (!s || !canWork(s)) return; const r=s.rows[+t.dataset.ci]; if (!r) return;
  const k=t.dataset.k; r[k] = k==="exp" ? t.value : num(t.value);
  saveSheet(s);
  const cell=document.getElementById("c_rm_"+t.dataset.ci); if (cell) cell.innerHTML=remarkHTML(r);
});
document.addEventListener("change", e=>{
  const t=e.target; const a=t.dataset&&t.dataset.act;
  if (a==="selstore"){ S.sid=t.value; S.edit=null; S.imp=null; render(); }
  else if (a==="selper"){ S.per=t.value; S.edit=null; S.imp=null; render(); }
  else if (a==="status"){ const s=getSheet(S.sid,S.per,true); s.status=t.value; if (t.value==="up"){ s.up=s.up||{}; if(!s.up.date) s.up.date=todayISO(); } saveSheet(s); render(); }
  else if (a==="upf"){ const s=getSheet(S.sid,S.per,true); s.up=s.up||{}; s.up[t.dataset.k]=t.value.trim(); saveSheet(s); }
  else if (a==="upfile"){ if (t.files.length) addProof([...t.files]); }
  else if (a==="ifile"){ if (t.files[0]) readFile(t.files[0]); }
  else if (a==="iopt"){ S.imp.onlyEd=!!($("#i_onlyEd")&&$("#i_onlyEd").checked); S.imp.combine=$("#i_comb").checked; render(); }
  else if (a==="sname"){ const st=S.stores.find(s=>s.id===t.dataset.sid); if (t.value.trim()){ st.name=t.value.trim(); saveSetup(); render(); } }
});

/* ---------- who works on which branch ----------
   Website logins: Sites "edpms-mercedes, edpms-salcedo" limits a staff member to those branches; "edpms" or "all" = every branch. */
function applyAllow(){
  const sites=String((window.WS_USER&&window.WS_USER.sites)||"").toLowerCase().split(/[\s,;]+/).filter(Boolean);
  const want=sites.filter(x=>x.startsWith("edpms-")).map(x=>x.slice(6).replace(/[^a-z0-9]/g,""));
  if (!want.length){ S.allow=null; return; }
  S.allow=S.stores.filter(st=>want.includes(st.name.toLowerCase().replace(/[^a-z0-9]/g,""))||want.includes(st.id)).map(st=>st.id);
  if (!S.allow.length) S.allow=["_none"];
}
addEventListener("pagehide",()=>{ if (pending.size) flush(); });
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="hidden" && pending.size) flush(); });
/* ---------- boot ---------- */
S.year=new Date().getFullYear(); S.per=nextPeriod();
lsLoad(); render(); setSaveState("Connecting…");
(async()=>{
  const w=window.claude;
  if (!w || !w.use){ setSaveState("Saved on this device only"); return; }
  const [db,assets,dl,user]=await Promise.all([w.use("db"),w.use("assets"),w.use("downloads"),w.use("user")]);
  S.assets=assets; S.dl=dl;
  const site = !!window.WS_CFG;
  S.mgr = user ? !!(await user.canEdit()) : true;
  try{ S.who = window.WS_USER ? window.WS_USER.name : (user && user.name ? await user.name() : ""); }catch(e){}
  if (!S.mgr && !site){ $("#view").innerHTML=`<div class="panel lock"><h2>Manager only</h2><div class="sub">This EDPMS desk is for the pharmacy owner and managers.</div></div>`; return; }
  if (!S.mgr){ $("#btnAll").hidden=true; applyAllow(); }
  if (!db){ setSaveState("Saved on this device only"); return; }
  S.db=db;
  db.doc("edpms/setup").onSnapshot(sn=>{ const d=sn.exists?JSON.parse(JSON.stringify(sn.data())):null; if (d&&Array.isArray(d.stores)&&d.stores.length){ S.stores=d.stores; } if (!S.mgr) applyAllow(); if (!myStores().some(s=>s.id===S.sid)) S.sid=myStores()[0]?.id; if(!S.edit) render(); }, e=>setSaveState("Could not load: "+(e.message||e.code)));
  db.collection("edpms/setup/sheets").onSnapshot(sn=>{
    const fresh={}; sn.docs.forEach(d=>{ const v=d.data(); if (v) fresh[d.id]=JSON.parse(JSON.stringify(v)); }); // own copy: stored data can be read-only
    for (const id of pending) if (S.sheets[id]) fresh[id]=S.sheets[id];
    if (!S.ready){ // first load: keep edits saved on this device that never reached the shared store
      for (const id in S.sheets){ const l=S.sheets[id], r=fresh[id]; if (l && l.updatedAt && (!r || (r.updatedAt||"") < l.updatedAt)){ fresh[id]=l; pending.add(id); } }
      if (pending.size){ clearTimeout(saveT); saveT=setTimeout(flush,300); }
    }
    S.sheets=fresh; S.ready=true; setSaveState(pending.size?"Saving…":"All changes saved"); lsSave();
    const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.ci!=null;
    if (!S.edit && !S.imp && !typing) render();
  }, e=>setSaveState("Could not load: "+(e.message||e.code)));
})();
